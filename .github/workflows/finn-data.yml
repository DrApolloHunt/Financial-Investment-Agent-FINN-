name: finn-data

# Runs only when started by hand (Actions -> finn-data -> Run workflow).
# The demo ships a frozen snapshot. For live data, add a schedule, e.g.
#   schedule: [{cron: "30 7 * * 1-5"}, {cron: "40 13 * * 1-5"}]   # 13:00 and 19:10 IST
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full | intraday | eod"
        default: "full"

permissions:
  contents: write

concurrency:
  group: finn-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINN_LLM_BUDGET: "120"
          FINN_TIME_BUDGET_MIN: "50"
        run: |
          MODE="${{ github.event.inputs.mode }}"
          python -m pipeline.run --mode "${MODE:-full}"
      - name: Commit data
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin main
          git push
