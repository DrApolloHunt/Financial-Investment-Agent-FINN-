name: finn-data

# Hourly filings during Indian market hours; full refresh (prices, ledgers)
# after the close. Times are UTC: 04:15-12:15 UTC = 09:45-17:45 IST.
on:
  schedule:
    - cron: "15 4-12 * * 1-5"   # intraday: filings
    - cron: "40 13 * * 1-5"     # 19:10 IST: full refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "full | intraday | eod"
        default: "full"

permissions:
  contents: write

concurrency:
  group: finn-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINN_LLM_BUDGET: "120"
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "40 13 * * 1-5" ]; then MODE=full; else MODE=intraday; fi
          fi
          python -m pipeline.run --mode "$MODE"
      - name: Commit data
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git push
